<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유튜브 검토함 · 서연모음.zip</title><link rel="stylesheet" href="/feed.css"><link rel="stylesheet" href="/youtube.css"><script src="/youtube.js" defer></script></head>
<body><header class="shell"><a class="wordmark" href="/">서연모음<span>.zip</span></a><a href="/admin/review-history">검토 내역</a></header><main class="shell"><h1>유튜브 검토함</h1><p class="muted">서연 개인 직캠과 외부 출연 콘텐츠를 확인해 주세요. 영상은 YouTube에서 재생됩니다.</p><nav class="youtube-toolbar" aria-label="검토함 이동"><a href="/admin/x">X</a><a href="/admin/instagram">Instagram</a><a href="/?manage=tools">URL 직접 등록</a></nav><div class="youtube-toolbar"><label for="youtube-state">표시 상태</label><select id="youtube-state"><option value="pending">검토 대기</option><option value="kept">표시 중</option><option value="held">보류</option><option value="excluded">제외</option><option value="all">전체</option></select><button id="youtube-refresh">새로고침</button></div><p id="youtube-notice" role="status"></p><div id="youtube-list"></div><button id="youtube-more" hidden>더 보기</button><details><summary>수집 상태</summary><p id="youtube-status"></p><form id="youtube-channel-form"><label for="youtube-channel">추적할 채널 ID 또는 @핸들</label><div class="youtube-toolbar"><input id="youtube-channel" required maxlength="101" placeholder="@채널핸들"><button type="submit">채널 추가</button></div><p>채널의 새 영상도 검토 후에만 피드에 표시됩니다.</p></form><button id="youtube-retry">연결 오류 확인 후 수집 재개</button></details></main></body></html>
